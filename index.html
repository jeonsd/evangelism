@media(prefers-reduced-motion:reduce){#txt{transition:none}}

#stage{overflow-y:auto}
#txt{margin:auto}

{t:"성경도 같은 말을 합니다. 하늘과 만물이 창조하신 분을 드러낸다고요. (시편 19편, 로마서 1장)",n:"성경도 같은 말을 합니다. 하늘과 만물이 창조하신 분을 드러내고 있다고 말합니다."},

function pickVoice(){if(!syn)return;const v=syn.getVoices().filter(x=>/^ko/i.test(x.lang));
  voice=v.find(x=>/Natural|Online|SunHi|InJoon/i.test(x.name))||v.find(x=>/Google|Yuna/i.test(x.name))||v[0]||null}
if(syn){pickVoice();syn.onvoiceschanged=pickVoice}
const GAP=80; // 컷 사이 쉬는 시간(ms). 0으로 하면 바로 이어짐
const au=new Audio(),pre=new Audio();
function prime(){
  au.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';au.play().catch(()=>{});
  if(syn){const p=new SpeechSynthesisUtterance(' ');p.volume=0;syn.speak(p)}
}
let cutT0=0;
const readMs=it=>2000+shown(it).length*140; // 글을 읽는 데 필요한 최소 시간
function fin(my){
  if(my!==token)return;
  clearTimeout(timer);
  if(mode==='auto'&&playing){
    const wait=Math.max(GAP,readMs(items[i])-(performance.now()-cutT0));
    if(i>=items.length-1){playing=false;btn()}
    else timer=setTimeout(()=>{if(my===token)go(i+1)},wait);
  }
}
function stopVoice(){au.onended=null;au.onerror=null;au.pause();if(syn&&(syn.speaking||syn.pending))syn.cancel()}
// mp3가 있으면 mp3를, 없으면 브라우저 음성으로 대신 읽음
function narrate(it,my){
  if(!sound)return;
  stopVoice();
  let fb=false;const fall=()=>{if(fb)return;fb=true;speak(it.n||it.t,my)};
  au.onended=()=>fin(my);
  au.onerror=fall;
  au.src=it.a;
  au.play().catch(fall);
  const nx=items[i+1];if(nx){pre.preload='auto';pre.src=nx.a}
}
function speak(text,my){
  if(my!==token||!sound)return;
  if(!syn){fin(my);return}
  // 읽는 중이 아닐 때는 취소하지 않고 바로 읽음(취소 직후 바로 읽으면 브라우저가 무시하는 문제를 피함)
  const busy=syn.speaking||syn.pending;
  if(busy)syn.cancel();
  const run=()=>{
    if(my!==token)return;
    const parts=text.split(/(?<=[.?!])\s+/).filter(Boolean);
    parts.forEach((q,n)=>{
      const u=new SpeechSynthesisUtterance(q);u.lang='ko-KR';u.rate=.9;if(voice)u.voice=voice;
      if(n===parts.length-1){u.onend=()=>fin(my);u.onerror=()=>fin(my)}
      syn.speak(u);
    });
  };
  busy?setTimeout(run,90):run();
}

// 장면 이동 버튼
S.forEach((_,n)=>{const b=document.createElement('button');b.textContent=n+1;b.setAttribute('aria-label',(n+1)+'장면');b.onclick=()=>go(items.findIndex(x=>x.si===n));$('dots').appendChild(b)});

function shown(it){let x=it.n||it.t;const m=(it.t||'').match(/\(([^)]*)\)\s*$/);if(m&&x.indexOf(m[1])<0)x+=' ('+m[1]+')';return x}
function render(){
  const it=items[i],t=$('txt'),my=++token;cutT0=performance.now();
  t.classList.remove('on');
  setTimeout(()=>{
    if(my!==token)return;
    t.textContent=shown(it);
    t.classList.toggle('big',!!it.big);
    if(it.todo){const s=document.createElement('small');s.textContent='이 장면은 다음 단계에서 채웁니다';t.appendChild(s)}
    if(it.tel){const a=document.createElement('a');a.href='tel:'+it.tel.replace(/-/g,'');a.textContent=it.tel;a.className='lk';a.onclick=e=>e.stopPropagation();t.appendChild(a)}
    if(it.more){const b=document.createElement('button');b.textContent='더 많은 이야기';b.className='lk';b.onclick=e=>{e.stopPropagation();openMore()};t.appendChild(b)}
    t.classList.add('on');
  },reduce?0:140);
  narrate(it,my);
  dT=it.dawn;sT=it.star?1:0;
  fxN=(window.FXM&&FXM[it.si]&&FXM[it.si][it.ci])||'none';fxT=performance.now()+100;fxInk=it.dawn>=.5?'90,60,30':'246,231,180';document.documentElement.style.setProperty('--tp',it.dawn>=.5?'rgba(255,255,255,.6)':'rgba(10,14,36,.5)');
  document.documentElement.style.setProperty('--ink',it.dawn>=.5?'#2b2540':'#f6e7b4');
  document.documentElement.style.setProperty('--panel',it.dawn>=.5?'rgba(255,255,255,.5)':'rgba(15,20,48,.55)');
  [...$('dots').children].forEach((d,n)=>d.classList.toggle('cur',n===it.si));
  btn();
}
function openMore(){stopVoice();token++;clearTimeout(timer);playing=false;btn();const L=window.STORIES||[{h:'준비 중입니다',p:''}];$('mbox').innerHTML='';L.forEach(x=>{const h=document.createElement('h2'),p=document.createElement('p');h.textContent=x.h;p.textContent=x.p;$('mbox').append(h,p)});$('more').hidden=false}
function btn(){$('play').textContent=playing?'멈춤':(i===items.length-1?'처음부터':'재생')}
function schedule(){
  clearTimeout(timer);
  if(mode!=='auto'||!playing)return;
  const L=(items[i].n||items[i].t).length,spoken=sound;
  if(i>=items.length-1){if(!spoken){playing=false;btn()}return}
  timer=setTimeout(()=>go(i+1),spoken?60000:readMs(items[i]));
}
function go(n){i=Math.max(0,Math.min(items.length-1,n));render();schedule()}
function begin(m){prime();mode=m;playing=m==='auto';$('start').classList.add('hide');$('ui').hidden=false;syncMode();go(0)}
function syncMode(){$('mode').textContent=mode==='auto'?'직접 넘기기':'자동 재생';$('play').hidden=mode!=='auto'}
$('bAuto').onclick=()=>begin('auto');
$('bMan').onclick=()=>begin('manual');
$('prev').onclick=()=>go(i-1);
$('next').onclick=()=>go(i+1);
$('play').onclick=()=>{if(!playing){playing=true;go(i>=items.length-1?0:i);return}playing=false;token++;clearTimeout(timer);stopVoice();btn()};
$('mode').onclick=()=>{mode=mode==='auto'?'manual':'auto';playing=mode==='auto';syncMode();go(i)};
$('cap').onclick=()=>{document.body.classList.toggle('nosub');$('cap').textContent=document.body.classList.contains('nosub')?'자막 켜기':'자막 끄기'};
$('mclose').onclick=()=>{$('more').hidden=true};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'소리 끄기':'소리 켜기';if(!sound)stopVoice();go(i)};
$('stage').onclick=()=>{if(mode==='manual')go(i+1)};
addEventListener('keydown',e=>{
  if($('start').classList.contains('hide')===false)return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(i+1)}
  if(e.key==='ArrowLeft')go(i-1);
});

// 별하늘
const cv=$('sky'),cx=cv.getContext('2d');
let W,H,stars=[],dawn=0,dT=0,star=0,sT=0,fxN='none',fxT=0,fxInk='246,231,180';
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);
  stars=Array.from({length:Math.round(W*H/7000)},()=>({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.4+.3,p:Math.random()*6.28}))}
addEventListener('resize',size);size();
const mix=(a,b,t)=>a.map((v,k)=>Math.round(v+(b[k]-v)*t));
const P=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
const S_=(c,k,a)=>{c.strokeStyle=`rgba(${k},${a})`;c.fillStyle=`rgba(${k},${a})`};
const dot=(c,x,y,r)=>{c.beginPath();c.arc(x,y,Math.max(r,0),0,6.283);c.fill()};
const ln=(c,a,b,d,e)=>{c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke()};
const FX={
glow:(c,x,y,t,u,k)=>{const r=u*(1+3*P(t,0,3));const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${k},.35)`);g.addColorStop(1,`rgba(${k},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill()},
constellation:(c,x,y,t,u,k)=>{const p=[[-4,1],[-2,-1],[0,.6],[2,-1.2],[4,.8]];S_(c,k,.85);p.forEach((q,i)=>{const a=P(t,i*.5,i*.5+.4);dot(c,x+q[0]*u,y+q[1]*u,u*.12*a);if(i){const o=p[i-1];ln(c,x+o[0]*u,y+o[1]*u,x+(o[0]+(q[0]-o[0])*a)*u,y+(o[1]+(q[1]-o[1])*a)*u)}})},
gather:(c,x,y,t,u,k)=>{S_(c,k,.85);const m=1-P(t,0,3);for(let i=0;i<18;i++){const a=i*2.4,r=(1.2+(i%5))*u*m;dot(c,x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*.7,u*.1+.5)}dot(c,x,y,u*.18)},
burst:(c,x,y,t,u,k)=>{S_(c,k,.85);const m=P(t,0,3);for(let i=0;i<24;i++){const a=i*2.4,r=(1.2+(i%5))*u*m;dot(c,x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*.7,u*.1+.5)}dot(c,x,y,u*.18)},
chain:(c,x,y,t,u,k)=>{for(let i=0;i<7;i++){const a=P(t,i*.45,i*.45+.4);S_(c,k,.9*a);dot(c,x+(i-3)*u*1.5,y,u*.28*a);if(i)ln(c,x+(i-4)*u*1.5,y,x+(i-3)*u*1.5,y)}const f=P(t,3.2,4.2);S_(c,k,.85*f);dot(c,x-4.5*u,y,u*.6*f)},
split:(c,x,y,t,u,k)=>{S_(c,k,.9);const a=P(t,0,1.2),b=P(t,1.2,2.6);ln(c,x-4*u,y,x-4*u+4*u*a,y);ln(c,x,y,x+4*u*b,y-2*u*b);ln(c,x,y,x+4*u*b,y+2*u*b)},
dim:(c,x,y,t,u,k)=>{c.fillStyle=`rgba(0,0,0,${.35*P(t,0,1.5)})`;c.fillRect(0,0,9999,9999)},
beams4:(c,x,y,t,u,k)=>{for(let i=0;i<4;i++){const a=P(t,i*.5,i*.5+.6);S_(c,k,.85*a);c.lineWidth=u*.25;ln(c,x+(i-1.5)*u*1.6,y-u*2.5,x+(i-1.5)*u*1.6,y-u*2.5+u*5*a)}},
gear:(c,x,y,t,u,k)=>{S_(c,k,.85);[[-1.2,1,12,1],[.9,.7,9,-1.4]].forEach(([dx,r,n,s])=>{c.beginPath();for(let i=0;i<=n*2;i++){const a=i*Math.PI/n+t*.6*s,rr=u*r*1.3*(i%2?1:1.18);c.lineTo(x+dx*u*1.6+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.stroke()})},
scale:(c,x,y,t,u,k)=>{S_(c,k,.9);const a=Math.sin(t*1.4)*.3*Math.exp(-t*.4),dx=Math.cos(a)*3*u,dy=Math.sin(a)*3*u;ln(c,x,y-2*u,x,y+2*u);ln(c,x-dx,y-dy,x+dx,y+dy);ln(c,x-1.5*u,y+2*u,x+1.5*u,y+2*u);dot(c,x-dx,y-dy+u*.8,u*.45);dot(c,x+dx,y+dy+u*.8,u*.45)},
circle:(c,x,y,t,u,k)=>{S_(c,k,.9);const r=u*(1+2.5*P(t,0,3));c.beginPath();c.setLineDash(t<3.5?[8,8]:[]);c.arc(x,y,r,0,6.283);c.stroke();c.setLineDash([])},
curtain:(c,x,y,t,u,k)=>{const o=P(t,0,2.5);const g=c.createLinearGradient(x-u,0,x+u,0);g.addColorStop(0,`rgba(${k},0)`);g.addColorStop(.5,`rgba(${k},${.45*o})`);g.addColorStop(1,`rgba(${k},0)`);c.fillStyle=g;c.fillRect(x-2*u,y-3*u,4*u,6*u);c.fillStyle='rgba(15,20,48,.85)';c.fillRect(x-4*u-o*3*u,y-3*u,4*u,6*u);c.fillRect(x+o*3*u,y-3*u,4*u,6*u)},
descend:(c,x,y,t,u,k)=>{const a=P(t,0,2.5);const g=c.createLinearGradient(0,y-4*u,0,y+u);g.addColorStop(0,`rgba(${k},0)`);g.addColorStop(1,`rgba(${k},.85)`);c.fillStyle=g;c.fillRect(x-u*.3,y-4*u,u*.6,5*u*a);S_(c,k,.6);dot(c,x,y+u*1.2,u*.25)},
book:(c,x,y,t,u,k)=>{const a=P(t,0,1.5);S_(c,k,.9);[-1,1].forEach(s=>{c.beginPath();c.moveTo(x,y+u);c.lineTo(x+s*3.2*u*a,y+u*.6);c.lineTo(x+s*3.2*u*a,y-u*1.4);c.lineTo(x,y-u*.8);c.closePath();c.stroke()});const g=c.createRadialGradient(x,y-u,0,x,y-u,u*4*P(t,.8,3)+1);g.addColorStop(0,`rgba(${k},.4)`);g.addColorStop(1,`rgba(${k},0)`);c.fillStyle=g;c.fillRect(x-4*u,y-5*u,8*u,5*u)},
cup:(c,x,y,t,u,k)=>{S_(c,k,.85);c.beginPath();for(let i=-60;i<=60;i++){const X=x+i*u*.1,Y=y+u*.8+Math.sin(i*.25+t*2)*u*.15;i>-60?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke();const d=u*1.6*P(t,1,2.5);c.beginPath();c.arc(x-2*u,y-u*.8+d,u*.5,0,Math.PI);c.stroke()},
signpost:(c,x,y,t,u,k)=>{S_(c,k,.9);const a=P(t,0,1.5);ln(c,x,y+2*u,x,y+2*u-4*u*a);c.beginPath();c.moveTo(x,y-u*1.5);c.lineTo(x+3*u*a,y-u*1.5);c.lineTo(x+3.6*u*a,y-u*.9);c.lineTo(x+3*u*a,y-u*.3);c.lineTo(x,y-u*.3);c.stroke()},
calendar:(c,x,y,t,u,k)=>{for(let i=0;i<14;i++){const a=P(t,i*.3,i*.3+.3);S_(c,k,.85);const X=x+((i%7)-3)*u*1.1,Y=y+(Math.floor(i/7)-.5)*u*1.1;c.strokeRect(X-u*.4,Y-u*.4,u*.8,u*.8);c.globalAlpha=a;c.fillRect(X-u*.4,Y-u*.4,u*.8,u*.8);c.globalAlpha=1}}
};
FX.people=(c,x,y,t,u,k)=>{const a=P(t,0,1.5);const g=c.createLinearGradient(0,y-4*u,0,y+u);g.addColorStop(0,`rgba(${k},0)`);g.addColorStop(1,`rgba(${k},${.5*P(t,1,3)})`);c.fillStyle=g;c.fillRect(x-4*u,y-4*u,8*u,5*u);S_(c,k,.9*a);for(let i=-2;i<=2;i++){const X=x+i*u*1.5,Y=y+u*1.5;dot(c,X,Y-u*1.1,u*.3);c.beginPath();c.moveTo(X-u*.45,Y+u*1.2);c.lineTo(X-u*.3,Y-u*.7);c.lineTo(X+u*.3,Y-u*.7);c.lineTo(X+u*.45,Y+u*1.2);c.closePath();c.fill()}};
FX.cross=(c,x,y,t,u,k)=>{const a=P(t,0,1.5),r=u*(2+2*P(t,0,3));const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${k},${.5*a})`);g.addColorStop(1,`rgba(${k},0)`);c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();S_(c,k,.95*a);c.fillRect(x-u*.18,y-u*2.2,u*.36,u*4.4);c.fillRect(x-u*1.3,y-u,u*2.6,u*.36)};
function frame(ts){
  dawn+=(dT-dawn)*.02;star+=(sT-star)*.03;
  const top=mix([15,20,48],[118,142,196],dawn),bot=mix([28,35,80],[247,222,172],dawn);
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${top})`);g.addColorStop(1,`rgb(${bot})`);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  const fade=1-dawn*.95;
  for(const s of stars){
    const tw=reduce?1:.5+.5*Math.sin(ts*.0015+s.p);
    cx.globalAlpha=(.3+.7*tw)*fade;cx.fillStyle='#fff6d6';
    cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill();
  }
  const ez=dawn*dawn*(3-2*dawn),sy=H*(1.0-.4*ez),sr=Math.min(W,H)*.09;
  if(dawn>.1){const al=Math.min(1,(dawn-.1)*1.6);const g2=cx.createRadialGradient(W*.5,sy,0,W*.5,sy,sr*3.4);g2.addColorStop(0,`rgba(255,236,170,${.9*al})`);g2.addColorStop(.3,`rgba(255,200,120,${.45*al})`);g2.addColorStop(1,'rgba(255,200,120,0)');cx.fillStyle=g2;cx.fillRect(0,0,W,H);cx.fillStyle=`rgba(255,244,205,${al})`;cx.beginPath();cx.arc(W*.5,sy,sr,0,6.283);cx.fill()}
  [[.84,mix([18,24,52],[140,104,78],dawn),.0035,1.1],[.9,mix([10,14,32],[92,70,60],dawn),.005,2.3]].forEach(([bs,col,f,ph])=>{cx.fillStyle=`rgb(${col})`;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=12)cx.lineTo(x,H*bs+Math.sin(x*f+ph)*H*.03+Math.sin(x*f*2.3)*H*.012);cx.lineTo(W,H);cx.fill()});
  {const px=W*.16,py=H*.9+Math.sin(px*.005+2.3)*H*.03+Math.sin(px*.005*2.3)*H*.012,hh=H*.085;cx.fillStyle=`rgb(${mix([4,6,16],[48,34,28],dawn)})`;cx.beginPath();cx.arc(px,py-hh*.92,hh*.12,0,6.283);cx.fill();cx.beginPath();cx.moveTo(px-hh*.16,py+2);cx.lineTo(px-hh*.09,py-hh*.78);cx.lineTo(px+hh*.09,py-hh*.78);cx.lineTo(px+hh*.16,py+2);cx.closePath();cx.fill()}
  if(star>.01){
    const x=W/2,y=H*.55,pulse=reduce?0:Math.sin(ts*.002)*.1;
    const rad=24+70*star;
    const rg=cx.createRadialGradient(x,y,0,x,y,rad);
    rg.addColorStop(0,'rgba(255,244,200,'+(.9*star)+')');rg.addColorStop(1,'rgba(255,244,200,0)');
    cx.globalAlpha=1;cx.fillStyle=rg;cx.beginPath();cx.arc(x,y,rad*(1+pulse),0,6.283);cx.fill();
    cx.fillStyle='#fffbe8';cx.globalAlpha=star;cx.beginPath();cx.arc(x,y,3.2,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;
  const ft=(ts-fxT)/1000;if(ft>0&&FX[fxN]){cx.save();cx.lineWidth=3.5;cx.lineCap='round';FX[fxN](cx,W/2,H*.6,ft,Math.min(W,H*1.2)/10,fxInk);cx.restore()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
