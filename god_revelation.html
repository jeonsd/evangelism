<style>

@keyframes copyIn{from{opacity:0;transform:translate(-20px,-35%)}to{opacity:1;transform:translate(0,-43%)}}.kicker{font-size:12px;letter-spacing:.22em;color:var(--gold);font-weight:900;margin-bottom:18px}.title{font-size:clamp(36px,5.4vw,72px);font-weight:900;letter-spacing:-.055em;line-height:1.12;margin:0 0 22px;text-shadow:0 5px 25px #000b}.title .word{display:inline-block;animation:wordIn .65s both;animation-delay:calc(var(--i)*.09s)}@keyframes wordIn{from{opacity:0;transform:translateY(35px) scale(.94);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}.desc{font-size:clamp(16px,1.75vw,22px);line-height:1.65;color:#f1f4f7;max-width:620px;text-shadow:0 3px 16px #000}.tag{display:inline-flex;margin-top:25px;padding:9px 15px;border:1px solid #ffd27a88;border-radius:99px;color:#ffe0a2;background:#ffd27a14;font-size:12px;letter-spacing:.06em}.caption{position:fixed;z-index:35;bottom:88px;left:50%;transform:translateX(-50%);width:min(960px,calc(100% - 32px));padding:13px 20px;border:1px solid #ffffff25;border-radius:13px;background:#06111de8;backdrop-filter:blur(12px);font-size:14px;line-height:1.55;text-align:center;color:#fff}.controls{position:fixed;z-index:40;bottom:0;left:0;right:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:#050b14f2;border-top:1px solid #ffffff20}.controlin{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}button,select{border:1px solid #65748a;background:#ffffff12;color:white;border-radius:99px;padding:10px 16px;font-weight:750;cursor:pointer}button.primary{background:var(--gold);border-color:var(--gold);color:#142033;min-width:150px}select{background:#14243a;max-width:190px}.status{font-size:12px;color:#a8ddca;min-width:90px;text-align:center}.hint{text-align:center;color:#aebaca;font-size:11px;margin-top:7px}

/* Teleological sequence: watch -> living organism -> ordered cosmos */
.clockReveal{transform-box:fill-box;transform-origin:center;animation:clockEnter 1.1s .15s both,clockHover 5s 1.3s ease-in-out infinite alternate}
.lifeReveal{transform-box:fill-box;transform-origin:center;animation:lifeEnter 1s 1.2s both,lifeHover 4.5s 2.2s ease-in-out infinite alternate}

@keyframes clockEnter{from{opacity:0;transform:translateX(-75px) scale(.55)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes lifeEnter{from{opacity:0;transform:translateY(65px) scale(.45)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes clockHover{to{transform:translateY(-8px)}}@keyframes lifeHover{to{transform:translateY(-12px)}}@keyframes orderHover{to{transform:translateY(-7px)}}

/* Motion elements */
.star{animation:twinkle 2.2s ease-in-out infinite alternate;transform-origin:center}@keyframes twinkle{from{opacity:.25;transform:scale(.75)}to{opacity:1;transform:scale(1.35)}}.orbit{transform-origin:50% 50%;animation:orbit 18s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}.gear{transform-origin:center;animation:gear 12s linear infinite}@keyframes gear{to{transform:rotate(360deg)}}.gear.reverse{animation-direction:reverse}.hand{transform-origin:50% 50%;animation:tick 4s steps(60) infinite}@keyframes tick{to{transform:rotate(360deg)}}.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-18px)}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(1.08)}}.ray{transform-origin:center;animation:ray 8s ease-in-out infinite alternate}@keyframes ray{to{transform:rotate(12deg) scale(1.08);opacity:.45}}.page{transform-origin:left center;animation:page 3s ease-in-out infinite alternate}@keyframes page{to{transform:rotateY(-25deg) skewY(-2deg)}}.rise{animation:rise 3s ease-in-out infinite alternate}@keyframes rise{to{transform:translateY(-22px)}}.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}.scan{animation:scan 4s ease-in-out infinite alternate}@keyframes scan{to{transform:translateX(55px);opacity:.3}}.shine{animation:shine 2.8s ease-in-out infinite alternate}@keyframes shine{to{filter:brightness(1.8);opacity:.7}}.fadein{animation:fadeIn 1s both}@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:700px){.visual:after{background:linear-gradient(0deg,#030914f5 0%,#030914a6 58%,#03091420 100%)}.art{width:100%;height:52%;right:0;top:5%;opacity:.82}.content{left:23px;right:23px;top:auto;bottom:170px;transform:none;width:auto;animation:mobileIn .8s .15s both}.slide[data-i="9"] .content{bottom:190px;width:auto;transform:none;animation:mobileIn .8s .15s both}@keyframes mobileIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}.title{font-size:clamp(34px,9vw,49px);margin-bottom:13px}.desc{font-size:15px;line-height:1.5}.kicker{margin-bottom:10px}.tag{margin-top:13px}.caption{bottom:105px;font-size:12px;padding:10px 13px}.controls{padding-bottom:calc(9px + env(safe-area-inset-bottom))}button{padding:9px 12px;font-size:12px}.status{order:2;width:100%}.brand{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

<div class="top"><div class="brand">THINK · SEEK · DISCOVER</div><div class="counter" id="counter">01 / 12</div></div><div class="progress" id="bar"></div><main id="slides"></main><div class="caption" id="caption">재생을 누르면 장면과 한국어 나레이션이 함께 진행됩니다.</div><div class="controls"><div class="controlin"><button id="prev">이전</button><button class="primary" id="play">▶ 나레이션 시작</button><button id="next">다음</button><button id="restart">처음부터</button><select id="voice"><option value="">기본 한국어 음성</option></select><span class="status" id="status">대기 중</span></div><div class="hint">장면별 모션그래픽 · 움직이는 오브젝트 · 문자 등장 효과 · 자동 나레이션 | Chrome / Edge 권장</div></div>
<script>
const slides=[
{t:'하나님은 과연 살아 계신가?',d:'우주와 자연, 그리고 성경이 들려주는 질문',k:'INTRODUCTION',s:'cosmos',n:'하나님은 과연 살아 계신가? 우리는 하나님을 어떻게 알 수 있을까요? 지금부터 인간의 이성으로 생각해 보고, 그 생각의 경계를 지나 하나님의 자기 계시를 살펴보겠습니다. 정답을 강요하기보다 질문을 따라 함께 생각하는 여정입니다.'},
{t:'익숙한 생각에 질문을 던지다',d:'우주와 생명, 그리고 인간의 도덕적 감각은 어디에서 왔을까요?',k:'A QUESTION FOR EVERYONE',s:'thinker',n:'하나님이 없다고 생각하는 사람도, 하나님이 있다고 믿는 사람도 이 질문 앞에 설 수 있습니다. 우주와 생명, 그리고 인간의 도덕적 감각은 어디에서 왔을까요? 이 질문은 기독교인만의 질문이 아닙니다. 인간이라면 누구나 생각해 볼 수 있는 질문입니다.'},
{t:'우주론적 논증',d:'원인에 원인을 거슬러 올라가면, 존재의 궁극적인 근원은 무엇일까요?',k:'THE COSMOLOGICAL ARGUMENT',s:'cosmos',n:'첫 번째는 우주론적 논증입니다. 우리 주변의 사물과 사건을 살펴보면, 그것들이 아무 이유 없이 저절로 존재하거나 일어난 것이 아니라는 사실을 알게 됩니다. 나무는 씨앗에서 자라고, 씨앗은 이전 식물에서 생겨납니다. 그 원인을 계속 거슬러 올라가면 또 다른 원인을 만나게 됩니다. 그렇다면 원인에 원인을 더하는 설명만으로는 세계 전체의 존재를 설명할 수 있을까요? 이 논증은 다른 것에 의존해 존재하는 것들의 연쇄가 궁극적으로는 더 이상 다른 원인에 의존하지 않는 최초의 원인, 곧 스스로 존재하는 근원에 이르러야 한다고 주장합니다. 그리고 그 최초의 근원이 하나님일 수 있다고 말합니다. 이것은 모든 사물에 시간상 첫 순간이 있다는 단순한 주장만은 아닙니다. 존재의 근거를 끝까지 묻는 철학적 논증입니다.'},
{t:'목적론적 논증',d:'우연히 만들어진 시계와 설계된 시계, 어느 설명이 더 합리적일까요?',k:'THE TELEOLOGICAL ARGUMENT',s:'clock',n:'두 번째는 목적론적 논증입니다. 해변을 걷다가 정교한 시계를 발견했다고 생각해 보십시오. 시계에는 톱니바퀴와 작은 축, 스프링과 바늘이 서로 맞물려 움직이는 구조가 있습니다. 바닷물 속 철분이 파도에 깎이고, 여러 금속 조각이 오랜 세월 굴러다니다 우연히 톱니 모양이 되고, 그것들이 다시 우연히 정확한 위치에 결합해 시간을 알려 주는 시계가 되었다고 설명한다면 납득할 수 있을까요? 오히려 누군가 목적을 가지고 설계하고 만든 뒤 바닷가에 떨어뜨렸다고 생각하는 편이 자연스럽습니다. 그렇다면 훨씬 복잡한 생명체와 자연의 질서, 우주의 조화는 무엇을 생각하게 할까요? 목적론적 논증은 자연에 나타나는 질서와 목적성의 근원을 지성 있는 창조주에게서 찾습니다. 시계의 비유 하나로 모든 생물학적 논쟁이 끝나는 것은 아닙니다. 이 논증이 던지는 질문은 이 질서와 조화를 궁극적으로 어떻게 설명할 것인가 하는 것입니다.'},
{t:'존재론적 논증',d:'가장 완전한 존재라는 개념은 실제 존재와 어떤 관계일까요?',k:'THE ONTOLOGICAL ARGUMENT',s:'ontology',n:'세 번째는 존재론적 논증입니다. 이 논증은 자연을 관찰하거나 어떤 사건의 원인을 추적하는 대신, 하나님이라는 개념 자체에서 출발합니다. 하나님을 그보다 더 위대한 존재를 생각할 수 없는 가장 완전한 존재라고 생각해 봅시다. 그런데 그런 존재가 오직 인간의 생각 속에만 있고 실제로는 존재하지 않는다면, 실제로 존재하는 존재보다 못한 존재가 됩니다. 그렇다면 가장 위대한 존재라는 개념과 실제 존재는 어떤 관계일까요? 존재론적 논증은 이 질문을 통해 하나님의 존재를 논리적으로 사유하려 합니다. 다만 어떤 것을 완전한 존재라고 정의한다고 해서 그것이 실제로 존재한다고 결론 내릴 수 있는가 하는 강한 반론이 있습니다. 그래서 이 논증은 네 가지 가운데서도 특히 추상적이고 철학적인 논쟁을 불러일으킵니다.'},
{t:'도덕론적 논증',d:'우리는 왜 어떤 일을 단순히 싫어하는 것이 아니라 잘못이라고 판단할까요?',k:'THE MORAL ARGUMENT',s:'moral',n:'네 번째는 도덕론적 논증입니다. 누군가 힘없는 아이를 이유 없이 괴롭히는 장면을 보았다고 생각해 보십시오. 우리는 단지 그 행동이 마음에 들지 않는다고 말하는 데 그치지 않습니다. 그것은 잘못된 일이며, 그렇게 해서는 안 된다고 판단합니다. 그런데 그 판단의 기준은 어디에서 오는 것일까요? 시대와 문화, 개인의 취향이 달라도 인간에게는 어떤 행동은 실제로 옳고 어떤 행동은 실제로 그르다는 도덕적 확신이 있습니다. 도덕론적 논증은 이러한 객관적인 선과 악의 기준과 인간이 따라야 한다고 느끼는 도덕적 의무가 어디에서 비롯되는지 묻습니다. 그리고 그 궁극적인 근거가 인간보다 높은 도덕적 근원, 곧 하나님에게 있다고 주장합니다. 만약 도덕이 오직 개인의 취향이나 사회적 합의에 불과하다면, 부당한 일을 두고 그것이 누구에게나 잘못이라고 말할 근거는 무엇일까요?'},
{t:'인간 이성의 가능성과 한계',d:'생각할 수 있다는 것과 온전히 안다는 것은 다릅니다.',k:'THE LIMITS OF HUMAN REASON',s:'limit',n:'네 가지 논증은 하나님을 생각하게 하는 의미 있는 시도입니다. 인간의 이성을 사용해 세계와 존재의 근원을 묻는 일은 무가치하지 않습니다. 그러나 인간은 유한한 존재입니다. 인간의 이성만으로 무한하고 초월적인 하나님의 본질과 뜻을 모두 파악할 수는 없습니다.'},
{t:'하나님께서 먼저 자신을 알리셨습니다',d:'인간의 탐구를 넘어 하나님의 자기 계시를 생각합니다.',k:'DIVINE REVELATION',s:'revelation',n:'기독교는 여기에서 하나님의 자기 계시를 말합니다. 인간이 하나님을 찾아내는 것만이 아니라, 하나님께서 먼저 자신을 알려 주셔야 한다는 것입니다. 하나님께서 선지자들과 사도들을 통해 자신을 드러내셨다고 증언합니다. 이것을 계시라고 부릅니다.'},
{t:'성경은 하나님을 알게 하는 기준입니다',d:'하나님께서 자신을 알리신 가장 분명하고 권위 있는 말씀',k:'THE SCRIPTURE · THE FINAL STANDARD',s:'bible',n:'성경은 하나님께서 선지자들과 사도들을 통해 자신을 알리신 말씀입니다. 기독교 신앙에서 성경은 하나님과 구원을 알게 하는 규범적이고 최종적인 기준입니다. 우리의 생각과 느낌, 개인적인 체험도 성경의 말씀에 비추어 분별해야 합니다. 자연은 하나님의 능력과 신성을 드러내지만, 죄와 구원, 예수 그리스도를 통한 구원의 길은 성경의 특별계시를 통해 구체적으로 알게 됩니다.'},
{t:'하나님은 삶 속에서도 자신을 알리십니다',d:'성경의 권위 아래, 삶에서 경험하는 하나님의 사랑과 임재',k:'GOD MEETS US IN LIFE',s:'believer',n:'기독교 신자들은 삶 속에서 하나님의 사랑과 임재, 인도하심과 도우심을 경험한다고 증언합니다. 이 경험은 단지 하나님에 관한 개념을 배우는 것과 다릅니다. 하나님께서 자신의 현실 세계에 찾아오셔서 만나 주시고, 사랑하시며, 인도하신다고 직접 깨닫는 개인적 경험입니다. 물론 그 경험의 형태와 강도는 사람마다 다르며, 성경과 같은 권위를 갖거나 새로운 교리를 세우는 기준이 될 수는 없습니다. 그러나 성경의 권위 아래 분별되는 개인의 경험은 하나님이 추상적인 개념에 머무는 분이 아니라 실제 삶 속에서 자신을 알리시는 살아 계신 분임을 더욱 구체적으로 알게 합니다. 개인의 경험이 모든 사람에게 반복되는 증명은 아니지만, 신앙인의 증언을 진지하게 들을 이유는 여기에 있습니다.'},
{t:'성령의 역사',d:'지식에서 그치지 않고 하나님을 알고자 하는 마음으로',k:'THE WORK OF THE HOLY SPIRIT',s:'spirit',n:'기독교는 사람이 논리만으로 구원에 이르는 믿음을 만들어 낸다고 말하지 않습니다. 성령께서 말씀을 통해 사람의 마음을 밝히시고, 하나님을 알고자 하는 마음을 일으키신다고 믿습니다. 유신논증이 지성에 질문을 던진다면, 성령께서는 그 질문이 하나님을 향한 진지한 탐구로 이어지도록 역사하십니다.'},
{t:'이제 성경을 통해 하나님을 알아가십시오',d:'질문을 가지고 성경을 직접 읽어 보십시오.',k:'AN INVITATION',s:'invitation',n:'이제 처음 질문으로 돌아가 봅시다. 인간이 하나님을 찾아가는 것과 하나님께서 자신을 알려 주시는 것, 어느 쪽이 참된 하나님을 알 수 있는 길일까요? 유신논증은 하나님을 생각하게 하는 출발점이 될 수 있습니다. 그러나 하나님을 참으로 알아가는 길은 하나님께서 자신을 알리신 말씀을 듣는 데 있습니다. 성경을 직접 읽고 예수 그리스도를 살펴보십시오.'}
];

function update(){document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));document.getElementById('counter').textContent=`${String(idx+1).padStart(2,'0')} / ${slides.length}`;document.getElementById('bar').style.width=`${(idx+1)/slides.length*100}%`;caption.textContent=slides[idx].n;}
function cancelSpeech(label='대기 중'){
 runToken++;playing=false;paused=false;utter=null;chunks=[];chunkIndex=0;
 if('speechSynthesis' in window){speechSynthesis.cancel();}
 playBtn.textContent='▶ 나레이션 시작';status.textContent=label;
}
function splitNarration(text){
 const sentences=text.match(/[^.!?。]+[.!?。]?/g)||[text];const out=[];let part='';
 for(let sentence of sentences){sentence=sentence.trim();if(!sentence)continue;
  if((part+ ' '+sentence).trim().length<=125){part=(part+' '+sentence).trim();continue;}
  if(part)out.push(part);part='';
  while(sentence.length>125){let cut=Math.max(sentence.lastIndexOf(' ',125),sentence.lastIndexOf(',',125),sentence.lastIndexOf('，',125));if(cut<45)cut=125;out.push(sentence.slice(0,cut).trim());sentence=sentence.slice(cut).trim();}
  part=sentence;
 }
 if(part)out.push(part);return out;
}
function speakChunk(token){
 if(token!==runToken||!playing||paused)return;
 if(chunkIndex>=chunks.length){
  status.textContent='장면 설명 완료';
  if(idx<slides.length-1){setTimeout(()=>{if(token!==runToken||!playing||paused)return;idx++;update();beginNarration();},900);}
  else{playing=false;playBtn.textContent='▶ 다시 듣기';status.textContent='감상 완료';}
  return;
 }
 const u=new SpeechSynthesisUtterance(chunks[chunkIndex]);utter=u;u.lang='ko-KR';u.rate=0.94;u.pitch=1;
 const selected=voiceSelect.value;const v=voices.find(v=>v.name===selected);if(v)u.voice=v;
 u.onstart=()=>{if(token===runToken)status.textContent=`나레이션 재생 중 · ${chunkIndex+1}/${chunks.length}`;};
 u.onend=()=>{if(token!==runToken||!playing||paused)return;chunkIndex++;speakChunk(token);};
 u.onerror=(e)=>{if(token!==runToken)return;if(e.error==='canceled'||e.error==='interrupted')return;status.textContent='음성 재생 오류';playing=false;playBtn.textContent='▶ 다시 듣기';};
 speechSynthesis.speak(u);
}
function beginNarration(){
 if(!('speechSynthesis'in window)){status.textContent='이 브라우저는 음성을 지원하지 않습니다.';return;}
 runToken++;const token=runToken;speechSynthesis.cancel();paused=false;playing=true;chunkIndex=0;chunks=splitNarration(slides[idx].n);playBtn.textContent='Ⅱ 일시정지';status.textContent='나레이션 준비 중';speakChunk(token);
}
function pauseOrResume(){
 if(!('speechSynthesis'in window)){beginNarration();return;}
 if(playing){speechSynthesis.pause();paused=true;playing=false;playBtn.textContent='▶ 계속 듣기';status.textContent='일시정지';return;}
 if(paused){speechSynthesis.resume();paused=false;playing=true;playBtn.textContent='Ⅱ 일시정지';status.textContent='나레이션 재개';return;}
 beginNarration();
}
function goTo(nextIndex){cancelSpeech('새 장면 재생 준비');idx=Math.max(0,Math.min(slides.length-1,nextIndex));update();beginNarration();}
make();update();
document.getElementById('next').onclick=()=>goTo(idx+1);
document.getElementById('prev').onclick=()=>goTo(idx-1);
playBtn.onclick=pauseOrResume;
document.getElementById('restart').onclick=()=>goTo(0);
function loadVoices(){
 if(!('speechSynthesis'in window))return;
 const available=speechSynthesis.getVoices();voices=available.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('ko'));
 const previous=voiceSelect.value;voiceSelect.innerHTML='';
 const preferred=voices.find(v=>/google.*(한국|korean)|(한국|korean).*google/i.test(v.name))||voices.find(v=>/google/i.test(v.name)&&v.lang.toLowerCase().startsWith('ko'))||null;
 voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;voiceSelect.appendChild(o);});
 if(previous&&voices.some(v=>v.name===previous))voiceSelect.value=previous;
 else if(preferred)voiceSelect.value=preferred.name;
 else if(voices.length)voiceSelect.value=voices[0].name;
 if(preferred){status.textContent='Google 한국어 음성 선택됨';}
 else if(voices.length){status.textContent='한국어 기본 음성 선택됨';}
 else{status.textContent='한국어 음성 로딩 대기';}
}
if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
</script></body></html>
